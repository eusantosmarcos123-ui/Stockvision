services:
  - type: web
    name: stockvision-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/backend/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
