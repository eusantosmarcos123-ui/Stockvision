<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=views/login.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVision - Carregando...</title>
    <script>
        // Se já tiver token, redireciona para o dashboard, senão para login
        const token = localStorage.getItem('token') || localStorage.getItem('authToken');
        if (token) {
            window.location.replace('views/dashboard.html');
        } else {
            window.location.replace('views/login.html');
        }
    </script>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; background:#f4f6f8; margin:0;">
    <p>Redirecionando para o <strong>StockVision</strong>...</p>
</body>
</html>
